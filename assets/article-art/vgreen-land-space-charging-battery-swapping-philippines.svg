<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" xml:lang="en-PH" font-family="DejaVu Sans, Noto Sans CJK SC, Noto Sans CJK KR, sans-serif"><title>Which sites is V-Green seeking?</title><rect width="1200" height="630" fill="#f6f1e6"/><rect width="550" height="630" fill="#24485b"/><text x="40" fill="#ffd894" font-size="23" font-weight="700"><tspan x="40" y="66">DT CAR / PHILIPPINES</tspan></text><text x="40" fill="#ffffff" font-size="48" font-weight="700"><tspan x="40" y="186">Which sites is</tspan><tspan x="40" y="254">V-Green</tspan><tspan x="40" y="322">seeking?</tspan></text><text x="594" fill="#173843" font-size="30" font-weight="700"><tspan x="594" y="80">Site submissions</tspan></text><path d="M596 144h548" stroke="#b6c1b6" stroke-width="2"/><circle cx="615" cy="186" r="17" fill="#166461"/><text x="608" fill="#fff" font-size="22" font-weight="700"><tspan x="608" y="192">1</tspan></text><text x="652" fill="#173843" font-size="33" font-weight="400"><tspan x="652" y="193">Metro Manila is the first</tspan><tspan x="652" y="240">priority</tspan></text><path d="M596 289h548" stroke="#b6c1b6" stroke-width="2"/><circle cx="615" cy="331" r="17" fill="#166461"/><text x="608" fill="#fff" font-size="22" font-weight="700"><tspan x="608" y="337">2</tspan></text><text x="652" fill="#173843" font-size="32" font-weight="400"><tspan x="652" y="337">Space for EV charging</tspan><tspan x="652" y="382">bays or battery swapping</tspan></text><path d="M596 434h548" stroke="#b6c1b6" stroke-width="2"/><circle cx="615" cy="476" r="17" fill="#166461"/><text x="608" fill="#fff" font-size="22" font-weight="700"><tspan x="608" y="482">3</tspan></text><text x="652" fill="#173843" font-size="33" font-weight="400"><tspan x="652" y="483">Submit access, layout</tspan><tspan x="652" y="530">and utility details</tspan></text></svg>
