<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" font-family="DejaVu Sans, sans-serif"><title>Đón sân bay Manila khi cả nhà từ Việt Nam đến trên hai chuyến bay</title><rect width="1200" height="630" fill="#f5f1e7"/><rect width="630" height="630" fill="#095356"/><text x="46" y="75" fill="#fadc9c" font-size="25" font-weight="bold">DT TOUR  /  PHILIPPINES</text><text x="44" y="170" font-size="38" fill="#fff" font-weight="bold">Đón sân bay Manila khi cả</text><text x="44" y="225" font-size="38" fill="#fff" font-weight="bold">nhà từ Việt Nam đến trên</text><text x="44" y="280" font-size="38" fill="#fff" font-weight="bold">hai chuyến bay</text><text x="679" y="92" fill="#095356" font-size="26" font-weight="bold">Thông tin nên gửi</text><path d="M679 152h467" stroke="#a4b4ae"/><text x="680" y="202" font-size="24" fill="#095356">1.</text><text x="723" y="202" font-size="25" fill="#213a40">Hai mã chuyến bay</text><path d="M679 295h467" stroke="#a4b4ae"/><text x="680" y="345" font-size="24" fill="#095356">2.</text><text x="723" y="345" font-size="25" fill="#213a40">Khách và vali từng nhóm</text><path d="M679 438h467" stroke="#a4b4ae"/><text x="680" y="488" font-size="24" fill="#095356">3.</text><text x="723" y="488" font-size="25" fill="#213a40">Khách sạn trả khách</text></svg>
