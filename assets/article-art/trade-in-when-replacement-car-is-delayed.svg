<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" font-family="DejaVu Sans, sans-serif"><title>Car trade-in in Manila when you still need your old car for work</title><rect width="1200" height="630" fill="#f5f1e7"/><rect width="630" height="630" fill="#384f43"/><text x="46" y="75" fill="#fadc9c" font-size="25" font-weight="bold">DT CAR  /  PHILIPPINES</text><text x="44" y="170" font-size="38" fill="#fff" font-weight="bold">Car trade-in in Manila</text><text x="44" y="225" font-size="38" fill="#fff" font-weight="bold">when you still need your</text><text x="44" y="280" font-size="38" fill="#fff" font-weight="bold">old car for work</text><text x="679" y="92" fill="#384f43" font-size="26" font-weight="bold">What to send</text><path d="M679 152h467" stroke="#a4b4ae"/><text x="680" y="202" font-size="24" fill="#384f43">1.</text><text x="723" y="202" font-size="25" fill="#213a40">Offer expiry</text><path d="M679 295h467" stroke="#a4b4ae"/><text x="680" y="345" font-size="24" fill="#384f43">2.</text><text x="723" y="345" font-size="25" fill="#213a40">Last date you need the car</text><path d="M679 438h467" stroke="#a4b4ae"/><text x="680" y="488" font-size="24" fill="#384f43">3.</text><text x="723" y="488" font-size="25" fill="#213a40">Confirmed replacement date</text></svg>
