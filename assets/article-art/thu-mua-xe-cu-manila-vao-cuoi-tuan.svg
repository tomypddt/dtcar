<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" font-family="DejaVu Sans, sans-serif"><title>Thu mua xe cũ ở Manila: chuẩn bị gì nếu chỉ rảnh cuối tuần?</title><rect width="1200" height="630" fill="#f5f1e7"/><rect width="630" height="630" fill="#384f43"/><text x="46" y="75" fill="#fadc9c" font-size="25" font-weight="bold">DT CAR  /  PHILIPPINES</text><text x="44" y="170" font-size="38" fill="#fff" font-weight="bold">Thu mua xe cũ ở Manila:</text><text x="44" y="225" font-size="38" fill="#fff" font-weight="bold">chuẩn bị gì nếu chỉ rảnh</text><text x="44" y="280" font-size="38" fill="#fff" font-weight="bold">cuối tuần?</text><text x="679" y="92" fill="#384f43" font-size="26" font-weight="bold">Thông tin nên gửi</text><path d="M679 152h467" stroke="#a4b4ae"/><text x="680" y="202" font-size="24" fill="#384f43">1.</text><text x="723" y="202" font-size="25" fill="#213a40">Thông tin xe và số km</text><path d="M679 295h467" stroke="#a4b4ae"/><text x="680" y="345" font-size="24" fill="#384f43">2.</text><text x="723" y="345" font-size="25" fill="#213a40">Địa điểm và hai khung giờ</text><path d="M679 438h467" stroke="#a4b4ae"/><text x="680" y="488" font-size="24" fill="#384f43">3.</text><text x="723" y="488" font-size="25" fill="#213a40">Ngày sớm nhất có thể giao</text></svg>
