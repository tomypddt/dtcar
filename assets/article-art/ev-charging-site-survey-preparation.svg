<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" xml:lang="en-PH" font-family="DejaVu Sans, Noto Sans CJK SC, Noto Sans CJK KR, sans-serif"><title>Preparing a Philippine Property for an EV Site Survey</title><rect width="1200" height="630" fill="#f6f1e6"/><rect width="550" height="630" fill="#51413f"/><text x="40" fill="#ffd894" font-size="23" font-weight="700"><tspan x="40" y="66">DT CAR / PHILIPPINES</tspan></text><text x="40" fill="#ffffff" font-size="48" font-weight="700"><tspan x="40" y="186">Preparing a</tspan><tspan x="40" y="254">Philippine</tspan><tspan x="40" y="322">Property for an</tspan><tspan x="40" y="390">EV Site Survey</tspan></text><text x="594" fill="#173843" font-size="30" font-weight="700"><tspan x="594" y="80">Preparation checklist</tspan></text><path d="M596 144h548" stroke="#b6c1b6" stroke-width="2"/><circle cx="615" cy="186" r="17" fill="#166461"/><text x="608" fill="#fff" font-size="22" font-weight="700"><tspan x="608" y="192">1</tspan></text><text x="652" fill="#173843" font-size="27" font-weight="400"><tspan x="652" y="187">Confirm the access, technical</tspan><tspan x="652" y="225">and leasing contacts.</tspan></text><path d="M596 289h548" stroke="#b6c1b6" stroke-width="2"/><circle cx="615" cy="331" r="17" fill="#166461"/><text x="608" fill="#fff" font-size="22" font-weight="700"><tspan x="608" y="337">2</tspan></text><text x="652" fill="#173843" font-size="26" font-weight="400"><tspan x="652" y="331">Share current parking photos</tspan><tspan x="652" y="368">and known site restrictions.</tspan></text><path d="M596 434h548" stroke="#b6c1b6" stroke-width="2"/><circle cx="615" cy="476" r="17" fill="#166461"/><text x="608" fill="#fff" font-size="22" font-weight="700"><tspan x="608" y="482">3</tspan></text><text x="652" fill="#173843" font-size="29" font-weight="400"><tspan x="652" y="479">Assign owners to questions</tspan><tspan x="652" y="520">raised during the survey.</tspan></text></svg>
